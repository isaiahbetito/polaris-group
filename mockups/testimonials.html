<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polaris — Testimonial cards (draggable stack)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =============================================================
     POLARIS — DRAGGABLE TESTIMONIAL CARD STACK (vanilla JS port of
     the Framer Motion component). Drag the front card left to shuffle;
     click it, or use the arrows, as fallback. Honours reduced-motion.
     Customize: --card-w/--card-h, --fan (rotation), card colors below.
     ============================================================= */
  :root{
    --ink:#0A1419; --navy-deep:#0B2E4F; --navy-mid:#1A3A5F; --steel:#3D5A75;
    --silver-1:#B8C2CC; --silver-2:#D6DCE2; --cream:#FAF8F3; --white:#FFFFFF; --silver-accent:#6B7B8C;
    --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",-apple-system,sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --card-w:360px; --card-h:460px; --fan:6deg;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:#fff;min-height:100vh;
    background:radial-gradient(70% 60% at 50% 30%,#103a5e,transparent 60%),linear-gradient(180deg,#0B2E4F,#061a2c)}

  .tsection{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px;text-align:center}
  .eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--silver-1)}
  .eyebrow::before,.eyebrow::after{content:"";width:30px;height:1px;background:rgba(184,194,204,.5)}
  .tsection h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4vw,3rem);margin:18px 0 8px}
  .tsection h2 em{font-style:italic;color:var(--silver-1)}
  .thint{font-size:.85rem;color:var(--silver-2);opacity:.7;margin-bottom:52px}

  /* stack */
  .tstack{position:relative;width:var(--card-w);height:var(--card-h);margin:0 auto}
  .tcard{position:absolute;top:0;left:0;width:var(--card-w);height:var(--card-h);
    display:grid;place-content:center;gap:22px;padding:34px;border-radius:18px;
    border:1px solid rgba(184,194,204,.28);background:rgba(13,40,66,.35);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.7);backdrop-filter:blur(10px);
    transition:transform .4s var(--ease),opacity .4s var(--ease);will-change:transform;text-align:center;touch-action:none}
  /* fan positions — front / middle / back (extra cards stack at back) */
  .tcard[data-pos="0"]{transform:translateX(0) rotate(calc(-1 * var(--fan)));z-index:3}
  .tcard[data-pos="1"]{transform:translateX(42px) rotate(0deg);z-index:2}
  .tcard[data-pos="2"]{transform:translateX(84px) rotate(var(--fan));z-index:1}
  .tcard[data-pos="3"]{transform:translateX(120px) rotate(calc(2 * var(--fan)));z-index:0;opacity:.55}
  .tcard[data-pos="0"]{cursor:grab}
  .tcard[data-pos="0"].dragging{cursor:grabbing;transition:none}

  .tcard__avatar{width:108px;height:108px;margin:0 auto;border-radius:50%;
    background:linear-gradient(160deg,#0B2E4F,#1A3A5F);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:2rem;box-shadow:0 0 0 1px var(--silver-1),0 0 0 5px rgba(255,255,255,.06)}
  .tcard__quote{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.4;color:var(--silver-2)}
  .tcard__author{font-size:.82rem;font-weight:600;letter-spacing:.04em;color:#7ea3cf}
  .tcard__tag{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--silver-accent);margin-top:4px}

  .tnav{display:flex;gap:14px;margin-top:48px}
  .tnav button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(184,194,204,.4);background:transparent;color:#fff;font-size:18px;cursor:pointer;transition:all .2s var(--ease)}
  .tnav button:hover{background:rgba(255,255,255,.08);border-color:#fff}

  @media(max-width:480px){ :root{--card-w:300px;--card-h:430px} .tcard[data-pos="1"]{transform:translateX(28px)} .tcard[data-pos="2"]{transform:translateX(56px) rotate(var(--fan))} }
  @media(prefers-reduced-motion:reduce){ .tcard{transition:none} }
</style>
</head>
<body>

<section class="tsection">
  <span class="eyebrow">Cosa dicono di noi</span>
  <h2>Le parole di <em>chi ci ha scelto.</em></h2>
  <p class="thint">Trascina la carta in cima verso sinistra per scorrere — testimonianze in raccolta.</p>

  <div class="tstack" id="tstack" aria-label="Testimonianze clienti"></div>

  <div class="tnav">
    <button id="tprev" aria-label="Precedente">&larr;</button>
    <button id="tnext" aria-label="Successiva">&rarr;</button>
  </div>
</section>

<script>
(function(){
  // PLACEHOLDER testimonials — clearly marked "in raccolta" (being collected).
  // Replace text + initials with real, authorized client quotes before launch.
  var data=[
    {initials:'PM', quote:'«Testimonianza in arrivo — un risultato concreto ottenuto con Polaris, in una o due frasi.»', author:'Direzione — PMI manifatturiera', tag:'Lombardia · in raccolta'},
    {initials:'SA', quote:'«Testimonianza in arrivo — l’esperienza di lavoro con il team, raccontata dal cliente.»', author:'Titolare — azienda di servizi', tag:'in raccolta'},
    {initials:'SC', quote:'«Testimonianza in arrivo — il punto di vista di un commercialista che invia i propri clienti.»', author:'Commercialista — studio associato', tag:'canale di referral · in raccolta'},
    {initials:'GI', quote:'«Testimonianza in arrivo — un percorso di formazione finanziata, dal bisogno al risultato.»', author:'Responsabile HR — gruppo industriale', tag:'in raccolta'}
  ];

  var stack=document.getElementById('tstack');
  var order=data.map(function(_,i){return i;});   // current visual order; order[0] = front

  function render(){
    stack.innerHTML='';
    // render back-to-front so DOM order doesn't fight z-index
    order.forEach(function(dataIdx,posRaw){
      var pos=Math.min(posRaw,3);
      var t=data[dataIdx];
      var card=document.createElement('article');
      card.className='tcard';
      card.setAttribute('data-pos',pos);
      card.innerHTML=
        '<div class="tcard__avatar" aria-hidden="true">'+t.initials+'</div>'+
        '<p class="tcard__quote">'+t.quote+'</p>'+
        '<div><div class="tcard__author">'+t.author+'</div><div class="tcard__tag">'+t.tag+'</div></div>';
      if(pos===0) attachDrag(card);
      stack.appendChild(card);
    });
  }

  function shuffle(){ order.push(order.shift()); render(); }                 // front -> back
  function unshuffle(){ order.unshift(order.pop()); render(); }              // back -> front

  function attachDrag(card){
    var startX=0, cur=0, dragging=false;
    card.addEventListener('pointerdown',function(e){
      dragging=true; startX=e.clientX; cur=0;
      card.classList.add('dragging'); card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove',function(e){
      if(!dragging) return;
      cur=e.clientX-startX;
      card.style.transform='translateX('+cur+'px) rotate('+(-6 + cur*0.03)+'deg)';
    });
    function end(){
      if(!dragging) return; dragging=false; card.classList.remove('dragging'); card.style.transform='';
      if(startX!==0 && cur < -150){ shuffle(); }   // dragged left far enough -> next
    }
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',end);
    card.addEventListener('lostpointercapture',end);
    // click (no real drag) also advances
    card.addEventListener('click',function(){ if(Math.abs(cur)<6) shuffle(); });
  }

  document.getElementById('tnext').addEventListener('click',shuffle);
  document.getElementById('tprev').addEventListener('click',unshuffle);
  render();
})();
</script>
</body>
</html>
